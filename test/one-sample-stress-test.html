<script>

    if (
        typeof parseData !== "function"
    ) {

        window.__parseDataFallbackUsed =
            true;


        window.parseData =
            function(
                id = "dataInput"
            ) {

                const element =
                    document.getElementById(
                        id
                    );


                if (!element) {

                    return {

                        data: [],
                        errors: [
                            "Input element not found."
                        ]

                    };

                }


                const raw =
                    element.value
                        .trim();


                if (!raw) {

                    return {

                        data: [],
                        errors: [
                            "Empty input."
                        ]

                    };

                }


                const tokens =
                    raw
                        .split(
                            /[\s,;\n\r\t]+/
                        )
                        .filter(
                            token =>
                                token.length > 0
                        );


                const data =
                    tokens.map(
                        Number
                    );


                const invalid =
                    data.some(
                        value =>
                            !Number.isFinite(
                                value
                            )
                    );


                if (invalid) {

                    return {

                        data: [],
                        errors: [
                            "Invalid numeric data."
                        ]

                    };

                }


                return {

                    data,
                    errors: []

                };

            };

    }


    if (
        typeof validateParsedData !==
        "function"
    ) {

        window.__validateParsedDataFallbackUsed =
            true;


        window.validateParsedData =
            function(
                parsed,
                minimumN
            ) {

                if (
                    !parsed ||
                    !Array.isArray(
                        parsed.data
                    )
                ) {

                    return false;

                }


                return (
                    parsed.data.length >=
                    minimumN
                );

            };

    }

<script>

/* ==========================================
   CONFIGURATION
   ========================================== */


/*
 * These references were calculated with
 * SciPy 1.17.0:
 *
 * scipy.stats.ttest_1samp()
 *
 * and:
 *
 * numpy.mean()
 * numpy.std(ddof=1)
 * scipy.stats.sem()
 */


const ABS_TOL =
    1e-10;


const REL_TOL =
    1e-8;


/*
 * For displayed/integration values we use
 * a separate tolerance because the Labistry
 * UI normally formats statistics.
 *
 * The mathematical validation below does NOT
 * use formatted values.
 */


const DISPLAY_TOL =
    1e-6;


/* ==========================================
   TEST COUNTERS
   ========================================== */

let totalTests =
    0;

let passTests =
    0;

let failTests =
    0;

let degenerateTests =
    0;

let executionErrors =
    0;

let warnings =
    0;


/* ==========================================
   NUMERIC COMPARISON
   ========================================== */

function nearlyEqual(
    actual,
    expected,
    absTol = ABS_TOL,
    relTol = REL_TOL
) {

    if (
        Number.isNaN(actual) &&
        Number.isNaN(expected)
    ) {

        return true;

    }


    if (
        actual === expected
    ) {

        return true;

    }


    if (
        !Number.isFinite(actual) ||
        !Number.isFinite(expected)
    ) {

        return false;

    }


    const difference =
        Math.abs(
            actual -
            expected
        );


    const scale =
        Math.max(
            Math.abs(expected),
            Math.abs(actual),
            1
        );


    return (
        difference <= absTol ||
        difference <=
        relTol * scale
    );

}


/* ==========================================
   FORMAT NUMBER
   ========================================== */

function formatNumber(
    value
) {

    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        value === Infinity
    ) {

        return "+Infinity";

    }


    if (
        value === -Infinity
    ) {

        return "-Infinity";

    }


    if (
        value === 0
    ) {

        return "0";

    }


    return Number(
        value
    ).toPrecision(14);

}


/* ==========================================
   TEST STORAGE
   ========================================== */

const testResults =
    [];


/* ==========================================
   ADD RESULT
   ========================================== */

function addResult(
    testName,
    metric,
    actual,
    expected,
    status,
    difference = NaN,
    note = ""
) {

    totalTests++;


    if (
        status === "PASS"
    ) {

        passTests++;

    }

    else if (
        status === "FAIL"
    ) {

        failTests++;

    }

    else if (
        status === "DEGENERATE"
    ) {

        degenerateTests++;

    }

    else if (
        status === "ERROR"
    ) {

        executionErrors++;

    }


    testResults.push({

        testName,
        metric,
        actual,
        expected,
        difference,
        status,
        note

    });

}


/* ==========================================
   TEST A SINGLE METRIC
   ========================================== */

function testMetric(
    testName,
    metric,
    actual,
    expected,
    options = {}
) {

    const {

        degenerate = false,
        absTol = ABS_TOL,
        relTol = REL_TOL,
        note = ""

    } = options;


    if (
        degenerate
    ) {

        addResult(
            testName,
            metric,
            actual,
            expected,
            "DEGENERATE",
            (
                Number.isFinite(actual) &&
                Number.isFinite(expected)
            )
                ? Math.abs(
                    actual -
                    expected
                )
                : NaN,
            note
        );

        return;

    }


    const equal =
        nearlyEqual(
            actual,
            expected,
            absTol,
            relTol
        );


    let difference;


    if (
        Number.isFinite(actual) &&
        Number.isFinite(expected)
    ) {

        difference =
            Math.abs(
                actual -
                expected
            );

    }

    else {

        difference =
            NaN;

    }


    addResult(
        testName,
        metric,
        actual,
        expected,
        equal
            ? "PASS"
            : "FAIL",
        difference,
        note
    );

}

/* ==========================================
   DIRECT FUNCTION VALIDATION
   ========================================== */

function runDirectTests() {

    for (
        const testCase of cases
    ) {

        const {

            name,
            data,
            mu0,
            reference

        } = testCase;


        try {

            const mean =
                calculateMean(
                    data
                );


            const sd =
                calculateStandardDeviation(
                    data,
                    true
                );


            const sem =
                calculateSEM(
                    data
                );


            const difference =
                mean -
                mu0;


            const t =
                difference /
                sem;


            const df =
                data.length -
                1;


            const p =
                calculateTTestPValue(
                    Math.abs(t),
                    df
                );


            testMetric(
                name,
                "mean",
                mean,
                reference.mean
            );


            testMetric(
                name,
                "standard deviation",
                sd,
                reference.sd
            );


            testMetric(
                name,
                "standard error",
                sem,
                reference.sem
            );


            testMetric(
                name,
                "mean difference",
                difference,
                reference.difference
            );


            testMetric(
                name,
                "t statistic",
                t,
                reference.t
            );


            testMetric(
                name,
                "degrees of freedom",
                df,
                reference.df
            );


            testMetric(
                name,
                "p-value",
                p,
                reference.p
            );

        }

        catch (error) {

            addResult(
                name,
                "execution",
                NaN,
                NaN,
                "ERROR",
                NaN,
                error.message
            );

        }

    }

}

            );


            testMetric(
                name,
                "mean difference",
                difference,
                reference.difference,
                {
                    degenerate:
                        true
                }
            );


            /*
             * Degenerate cases are reported,
             * but not counted as mathematical
             * PASS/FAIL because SciPy and JavaScript
             * can legitimately represent undefined
             * zero-variance cases differently.
             */

            addResult(
                name,
                "t statistic",
                t,
                reference.t,
                "DEGENERATE",
                NaN,
                "Zero-variance case."
            );


            testMetric(
                name,
                "degrees of freedom",
                df,
                reference.df,
                {
                    degenerate:
                        true
                }
            );


            addResult(
                name,
                "p-value",
                p,
                reference.p,
                "DEGENERATE",
                NaN,
                "Zero-variance case."
            );

        }

        catch (error) {

            addResult(
                name,
                "execution",
                NaN,
                NaN,
                "ERROR",
                NaN,
                error.message
            );

        }

    }

}


/* ==========================================
   TRUE ONE-SAMPLE FUNCTION TEST
   ========================================== */

function runIntegrationTests() {

    /*
     * We temporarily replace formatStatistic()
     * with identity formatting so that the actual
     * one-sample function renders full numerical
     * precision into the DOM.
     *
     * This does NOT alter one-sample.js.
     */

    const originalFormatStatistic =
        window.formatStatistic;


    if (
        typeof originalFormatStatistic !==
        "function"
    ) {

        warnings++;

        return;

    }


    window.formatStatistic =
        function(value) {

            return String(
                value
            );

        };


    const integrationCases = [

        cases[0],
        cases[3],
        cases[6],
        cases[8],
        cases[11],
        cases[14]

    ];


    for (
        const testCase of
        integrationCases
    ) {

        const {

            name,
            data,
            mu0,
            reference

        } = testCase;


        try {

            document.getElementById(
                "dataInput"
            ).value =
                data.join(" ");


            document.getElementById(
                "hypothesizedMean"
            ).value =
                String(mu0);


            document.getElementById(
                "result"
            ).innerHTML =
                "";


            calculateOneSampleTTest();


            const result =
                document.getElementById(
                    "result"
                );


            const strongs =
                result.querySelectorAll(
                    "strong"
                );


            /*
             * The result contains:
             *
             * n
             * mean
             * SD
             * SEM
             * mu0
             * difference
             * t
             * df
             * p
             *
             * We need:
             *
             * mean  -> index 1
             * SD    -> index 2
             * SEM   -> index 3
             * diff  -> index 5
             * t     -> index 6
             * df    -> index 7
             * p     -> index 8
             */

            if (
                strongs.length < 9
            ) {

                throw new Error(
                    "Unexpected rendered result structure."
                );

            }


            const actual = {

                mean:
                    Number(
                        strongs[1]
                            .textContent
                    ),

                sd:
                    Number(
                        strongs[2]
                            .textContent
                    ),

                sem:
                    Number(
                        strongs[3]
                            .textContent
                    ),

                difference:
                    Number(
                        strongs[5]
                            .textContent
                    ),

                t:
                    Number(
                        strongs[6]
                            .textContent
                    ),

                df:
                    Number(
                        strongs[7]
                            .textContent
                    ),

                p:
                    Number(
                        strongs[8]
                            .textContent
                    )

            };


            testMetric(
                "Integration — " + name,
                "mean",
                actual.mean,
                reference.mean
            );


            testMetric(
                "Integration — " + name,
                "standard deviation",
                actual.sd,
                reference.sd
            );


            testMetric(
                "Integration — " + name,
                "standard error",
                actual.sem,
                reference.sem
            );


            testMetric(
                "Integration — " + name,
                "mean difference",
                actual.difference,
                reference.difference
            );


            testMetric(
                "Integration — " + name,
                "t statistic",
                actual.t,
                reference.t
            );


            testMetric(
                "Integration — " + name,
                "degrees of freedom",
                actual.df,
                reference.df
            );


            testMetric(
                "Integration — " + name,
                "p-value",
                actual.p,
                reference.p
            );

        }

        catch (error) {

            addResult(
                "Integration — " + name,
                "execution",
                NaN,
                NaN,
                "ERROR",
                NaN,
                error.message
            );

        }

    }


    /*
     * Restore original formatter.
     */

    window.formatStatistic =
        originalFormatStatistic;

}


/* ==========================================
   RENDER RESULTS
   ========================================== */

function renderResults() {

    const container =
        document.getElementById(
            "results"
        );


    let html = `

        <table>

            <thead>

                <tr>

                    <th>
                        Test
                    </th>

                    <th>
                        Metric
                    </th>

                    <th>
                        Labistry
                    </th>

                    <th>
                        SciPy 1.17.0
                    </th>

                    <th>
                        Difference
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Note
                    </th>

                </tr>

            </thead>

            <tbody>

    `;


    for (
        const row of testResults
    ) {

        html += `

            <tr>

                <td>
                    ${row.testName}
                </td>

                <td>
                    ${row.metric}
                </td>

                <td>
                    ${formatNumber(
                        row.actual
                    )}
                </td>

                <td>
                    ${formatNumber(
                        row.expected
                    )}
                </td>

                <td>
                    ${formatNumber(
                        row.difference
                    )}
                </td>

                <td class="${row.status}">

                    <strong>
                        ${row.status}
                    </strong>

                </td>

                <td>
                    ${row.note || ""}
                </td>

            </tr>

        `;

    }


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;


    document.getElementById(
        "total"
    ).textContent =
        totalTests;


    document.getElementById(
        "pass"
    ).textContent =
        passTests;


    document.getElementById(
        "fail"
    ).textContent =
        failTests;


    document.getElementById(
        "degenerate"
    ).textContent =
        degenerateTests;


    document.getElementById(
        "errors"
    ).textContent =
        executionErrors;


    document.getElementById(
        "warnings"
    ).textContent =
        warnings;


    if (
        window.__parseDataFallbackUsed
    ) {

        const warning =
            document.createElement(
                "p"
            );


        warning.innerHTML =
            "<strong>Warning:</strong> " +
            "The real parseData() function was not loaded; " +
            "the harness used its local input parser fallback.";


        container.parentNode.insertBefore(
            warning,
            container
        );

    }

}

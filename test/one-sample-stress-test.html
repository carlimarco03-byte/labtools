<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */


const ABS_TOL =
    1e-10;


const REL_TOL =
    1e-8;


const P_ABS_TOL =
    1e-12;


const P_REL_TOL =
    1e-8;


/* =========================================================
   COUNTERS
   ========================================================= */


let totalTests =
    0;


let passTests =
    0;


let failTests =
    0;


let degenerateTests =
    0;


let executionErrors =
    0;


let warnings =
    0;


/* =========================================================
   NUMBER COMPARISON
   ========================================================= */


function nearlyEqual(
    a,
    b,
    absTolerance = ABS_TOL,
    relTolerance = REL_TOL
) {

    /*
     * NaN == NaN
     */

    if (
        Number.isNaN(a) &&
        Number.isNaN(b)
    ) {

        return true;

    }


    /*
     * Infinity
     */

    if (
        a === Infinity &&
        b === Infinity
    ) {

        return true;

    }


    if (
        a === -Infinity &&
        b === -Infinity
    ) {

        return true;

    }


    /*
     * Remaining non-finite mismatch.
     */

    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return false;

    }


    const difference =
        Math.abs(
            a - b
        );


    const scale =
        Math.max(
            Math.abs(a),
            Math.abs(b)
        );


    return (
        difference <=
        Math.max(
            absTolerance,
            relTolerance * scale
        )
    );

}


/* =========================================================
   FORMAT
   ========================================================= */


function formatValue(
    value
) {

    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        value === Infinity
    ) {

        return "+Infinity";

    }


    if (
        value === -Infinity
    ) {

        return "-Infinity";

    }


    if (
        !Number.isFinite(value)
    ) {

        return String(value);

    }


    return value.toPrecision(
        12
    );

}


/* =========================================================
   DIFFERENCE
   ========================================================= */


function getDifference(
    a,
    b
) {

    if (
        Number.isNaN(a) &&
        Number.isNaN(b)
    ) {

        return 0;

    }


    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return NaN;

    }


    return Math.abs(
        a - b
    );

}


/* =========================================================
   SUMMARY
   ========================================================= */


function updateSummary() {

    document.getElementById(
        "tests"
    ).textContent =
        totalTests;


    document.getElementById(
        "pass"
    ).textContent =
        passTests;


    document.getElementById(
        "fail"

        failTests;


    document.getElementById(
        "degenerate"
    ).textContent =
        degenerateTests;


    document.getElementById(
        "execution"
    ).textContent =
        executionErrors;


    document.getElementById(
        "warnings"
    ).textContent =
        warnings;

}


/* =========================================================
   ADD RESULT
   ========================================================= */


function addResult(
    testName,
    metric,
    labistry,
    scipy,
    status,
    difference = null
) {

    totalTests++;


    switch (
        status
    ) {

        case "PASS":

            passTests++;

            break;


        case "FAIL":

            failTests++;

            break;


        case "DEGENERATE":

            degenerateTests++;

            break;


        case "EXECUTION ERROR":

            executionErrors++;

            break;


        case "WARNING":

            warnings++;

            break;

    }


    const row =
        document.createElement(
            "tr"
        );


    let statusClass =
        "";


    switch (
        status
    ) {

        case "PASS":

            statusClass =
                "pass";

            break;


        case "FAIL":

            statusClass =
                "fail";

            break;


        case "DEGENERATE":

            statusClass =
                "degenerate";

            break;


        case "EXECUTION ERROR":

            statusClass =
                "execution";

            break;


        case "WARNING":

            statusClass =
                "warning";

            break;

    }


    row.innerHTML = `

        <td>
            ${testName}
        </td>

        <td>
            ${metric}
        </td>

        <td>
            ${formatValue(labistry)}
        </td>

        <td>
            ${formatValue(scipy)}
        </td>

        <td>
            ${
                difference === null
                    ? "—"
                    : formatValue(difference)
            }
        </td>

        <td class="${statusClass}">
            ${status}
        </td>

    `;


    document
        .getElementById(
            "results"
        )
        .appendChild(row);


    updateSummary();

}


/* =========================================================
   EXTRACT LABISTRY RESULT
   ========================================================= */


/*
 * calculateOneSampleTTest()
 * renders its result into #result.
 *
 * We deliberately read the values
 * from the actual rendered output.
 *
 * This means the harness exercises
 * the real Labistry implementation.
 */


function extractNumber(
    text
) {

    const cleaned =
        text
            .replace(
                /,/g,
                ""
            )
            .trim();


    /*
     * Handle common infinity
     * representations.
     */

    if (
        cleaned ===
        "Infinity"
    ) {

        return Infinity;

    }


    if (
        cleaned ===
        "-Infinity"
    ) {

        return -Infinity;

    }


    if (
        cleaned ===
        "NaN"
    ) {

        return NaN;

    }


    /*
     * The formatter may produce
     * scientific notation.
     */

    const value =
        Number(
            cleaned
        );


    return value;

}


/* =========================================================
   READ LABISTRY RESULT
   ========================================================= */


function readLabistryResult() {

    const result =
        document.getElementById(
            "result"
        );


    /*
     * Find all <strong> elements
     * generated by one-sample.js.
     *
     * Their order is:
     *
     * n
     * mean
     * sd
     * sem
     * hypothesized mean
     * difference
     * t
     * df
     * p
     */

    const values =
        Array.from(
            result.querySelectorAll(
                "strong"
            )
        );


    if (
        values.length < 9
    ) {

        throw new Error(
            "Could not extract the expected Labistry result values."
        );

    }


    return {

        n:
            extractNumber(
                values[0].textContent
            ),

        mean:
            extractNumber(
                values[1].textContent
            ),

        sd:
            extractNumber(
                values[2].textContent
            ),

        sem:
            extractNumber(
                values[3].textContent
            ),

        hypothesizedMean:
            extractNumber(
                values[4].textContent
            ),

        difference:
            extractNumber(
                values[5].textContent
            ),

        tStatistic:
            extractNumber(
                values[6].textContent
            ),

        degreesOfFreedom:
            extractNumber(
                values[7].textContent
            ),

        pValue:
            extractNumber(
                values[8].textContent
            )

    };

}


/* =========================================================
   RUN ONE TEST
   ========================================================= */


function runSciPyTest(
    testName,
    data,
    hypothesizedMean,
    reference
) {

    const dataInput =
        document.getElementById(
            "dataInput"
        );


    const meanInput =
        document.getElementById(
            "hypothesizedMean"
        );


    const resultElement =
        document.getElementById(
            "result"
        );


    /*
     * Prepare DOM exactly as the
     * real calculator expects.
     */

    dataInput.value =
        data.join(
            ","
        );


    meanInput.value =
        String(
            hypothesizedMean
        );


    resultElement.innerHTML =
        "";


    try {

        calculateOneSampleTTest();

    }
    catch (
        error
    ) {

        console.error(
            testName,
            error
        );


        addResult(
            testName,
            "execution",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );


        return;

    }


    let result;


    try {

        result =
            readLabistryResult();

    }
    catch (
        error
    ) {

        console.error(
            testName,
            error
        );


        addResult(
            testName,
            "result extraction",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );


        return;

    }


    /*
     * Metrics to validate.
     */

    const metrics = [

        [
            "mean",
            result.mean,
            reference.mean,
            false
        ],

        [
            "standard deviation",
            result.sd,
            reference.sd,
            false
        ],

        [
            "standard error",
            result.sem,
            reference.sem,
            false
        ],

        [
            "mean difference",
            result.difference,
            reference.difference,
            false
        ],

        [
            "t statistic",
            result.tStatistic,
            reference.t,
            false
        ],

        [
            "degrees of freedom",
            result.degreesOfFreedom,
            reference.df,
            false
        ],

        [
            "p-value",
            result.pValue,
            reference.p,
            true
        ]

    ];


    /*
     * Degenerate cases are reported
     * separately while still checking
     * numerical agreement.
     */

    if (
        reference.degenerate === true
    ) {

        let allPass =
            true;


        for (
            const metric
            of metrics
        ) {

            const [
                name,
                labistry,
                scipy,
                isPValue
            ] =
                metric;


            const pass =
                nearlyEqual(
                    labistry,
                    scipy,
                    isPValue
                        ? P_ABS_TOL
                        : ABS_TOL,
                    isPValue
                        ? P_REL_TOL
                        : REL_TOL
                );


            if (
                !pass
            ) {

                allPass =
                    false;

            }


            addResult(
                testName,
                name,
                labistry,
                scipy,
                pass
                    ? "DEGENERATE"
                    : "FAIL",
                getDifference(
                    labistry,
                    scipy
                )
            );

        }


        if (
            allPass
        ) {

            console.info(
                "DEGENERATE CASE PASSED:",
                testName
            );

        }


        return;

    }


    /*
     * Standard case.
     */

    for (
        const metric
        of metrics
    ) {

        const [
            name,
            labistry,
            scipy,
            isPValue
        ] =
            metric;


        const pass =
            nearlyEqual(
                labistry,
                scipy,
                isPValue
                    ? P_ABS_TOL
                    : ABS_TOL,
                isPValue
                    ? P_REL_TOL
                    : REL_TOL
            );


        addResult(
            testName,
            name,
            labistry,
            scipy,
            pass
                ? "PASS"
                : "FAIL",
            getDifference(
                labistry,
                scipy
            )
        );

    }

}

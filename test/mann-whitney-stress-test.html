<script>

/* =========================================================
   LABISTRY MANN–WHITNEY U STRESS TEST
   ========================================================= */


/* =========================================================
   TEST CONFIGURATION
   ========================================================= */

const ABS_TOL =
    1e-10;

const REL_TOL =
    1e-8;


/* =========================================================
   HELPERS
   ========================================================= */

function nearlyEqual(
    actual,
    expected,
    absTol = ABS_TOL,
    relTol = REL_TOL
) {

    if (
        Number.isNaN(actual) &&
        Number.isNaN(expected)
    ) {

        return true;

    }

    if (
        !Number.isFinite(actual) ||
        !Number.isFinite(expected)
    ) {

        return actual === expected;

    }

    const difference =
        Math.abs(
            actual - expected
        );

    const scale =
        Math.max(
            1,
            Math.abs(expected)
        );

    return (
        difference <= absTol ||
        difference <= relTol * scale
    );

}


/* =========================================================
   REFERENCE RANKING
   ========================================================= */

function referenceRanks(
    sampleA,
    sampleB
) {

    const combined = [

        ...sampleA.map(
            value => ({
                value,
                group: "A"
            })
        ),

        ...sampleB.map(
            value => ({
                value,
                group: "B"
            })
        )

    ];


    combined.sort(
        (a, b) =>
            a.value - b.value
    );


    const ranks =
        new Array(
            combined.length
        );


    let i = 0;


    while (
        i < combined.length
    ) {

        let j =
            i + 1;


        while (
            j < combined.length &&
            combined[j].value ===
                combined[i].value
        ) {

            j++;

        }


        const averageRank =
            (
                i + 1 +
                j
            ) / 2;


        for (
            let k = i;
            k < j;
            k++
        ) {

            ranks[k] =
                averageRank;

        }


        i = j;

    }


    return {
        combined,
        ranks
    };

}


/* =========================================================
   REFERENCE U
   ========================================================= */

function referenceMannWhitneyU(
    sampleA,
    sampleB
) {

    const nA =
        sampleA.length;

    const nB =
        sampleB.length;


    if (
        nA === 0 ||
        nB === 0
    ) {

        return NaN;

    }


    const {
        combined,
        ranks
    } =
        referenceRanks(
            sampleA,
            sampleB
        );


    let rankSumA =
        0;


    let rankSumB =
        0;


    for (
        let i = 0;
        i < combined.length;
        i++
    ) {

        if (
            combined[i].group === "A"
        ) {

            rankSumA +=
                ranks[i];

        } else {

            rankSumB +=
                ranks[i];

        }

    }


    const U1 =
        rankSumA -
        nA * (nA + 1) / 2;


    const U2 =
        rankSumB -
        nB * (nB + 1) / 2;


    return {

        U1,
        U2,

        U:
            Math.min(
                U1,
                U2
            )

    };

}


/* =========================================================
   REFERENCE CURRENT LABISTRY Z
   ========================================================= */

function referenceCurrentZ(
    sampleA,
    sampleB
) {

    const nA =
        sampleA.length;

    const nB =
        sampleB.length;

    const result =
        referenceMannWhitneyU(
            sampleA,
            sampleB
        );


    if (
        !Number.isFinite(
            result.U
        )
    ) {

        return NaN;

    }


    const meanU =
        nA * nB / 2;


    const variance =
        nA *
        nB *
        (
            nA +
            nB +
            1
        ) /
        12;


    const sigma =
        Math.sqrt(
            variance
        );


    if (
        sigma === 0
    ) {

        return NaN;

    }


    return (
        result.U -
        meanU
    ) / sigma;

}


/* =========================================================
   REFERENCE CURRENT LABISTRY P
   ========================================================= */

function referenceCurrentP(
    z
) {

    if (
        !Number.isFinite(z)
    ) {

        return NaN;

    }


    const probability =
        normalCDF(
            Math.abs(z)
        );


    return 2 *
        (
            1 -
            probability
        );

}


/* =========================================================
   REFERENCE TIE-CORRECTED VARIANCE
   ========================================================= */

function getTieGroups(
    sampleA,
    sampleB
) {

    const values = [

        ...sampleA,
        ...sampleB

    ].sort(
        (a, b) =>
            a - b
    );


    const groups = [];


    let i = 0;


    while (
        i < values.length
    ) {

        let j =
            i + 1;


        while (
            j < values.length &&
            values[j] === values[i]
        ) {

            j++;

        }


        const size =
            j - i;


        if (
            size > 1
        ) {

            groups.push(
                size
            );

        }


        i = j;

    }


    return groups;

}


function tieCorrectedVariance(
    sampleA,
    sampleB
) {

    const nA =
        sampleA.length;

    const nB =
        sampleB.length;

    const n =
        nA + nB;


    if (
        n < 2
    ) {

        return NaN;

    }


    const tieGroups =
        getTieGroups(
            sampleA,
            sampleB
        );


    let tieSum =
        0;


    for (
        const t of tieGroups
    ) {

        tieSum +=
            t * t * t -
            t;

    }


    return (
        nA *
        nB /
        12
    ) *
    (
        n + 1 -
        tieSum /
        (
            n *
            (n - 1)
        )
    );

}


/* =========================================================
   TIE-CORRECTED Z
   ========================================================= */

function referenceTieCorrectedZ(
    sampleA,
    sampleB
) {

    const result =
        referenceMannWhitneyU(
            sampleA,
            sampleB
        );


    if (
        !Number.isFinite(
            result.U
        )
    ) {

        return NaN;

    }


    const nA =
        sampleA.length;

    const nB =
        sampleB.length;


    const meanU =
        nA * nB / 2;


    const variance =
        tieCorrectedVariance(
            sampleA,
            sampleB
        );


    if (
        !Number.isFinite(
            variance
        ) ||
        variance <= 0
    ) {

        return NaN;

    }


    return (
        result.U -
        meanU
    ) /
    Math.sqrt(
        variance
    );

}


/* =========================================================
   TEST RESULT OBJECT
   ========================================================= */

const tests = [];


function addTest(
    name,
    category,
    actual,
    expected
) {

    const pass =
        nearlyEqual(
            actual,
            expected
        );


    tests.push({

        name,
        category,

        actual,
        expected,

        status:
            pass
                ? "PASS"
                : "FAIL"

    });

}


/* =========================================================
   U TESTS
   ========================================================= */

function testU(
    name,
    sampleA,
    sampleB
) {

    const reference =
        referenceMannWhitneyU(
            sampleA,
            sampleB
        );


    let actual;


    try {

        actual =
            calculateMannWhitneyU(
                sampleA,
                sampleB
            );

    } catch (error) {

        actual =
            NaN;

    }


    addTest(
        name,
        "U statistic",
        actual,
        reference.U
    );

}


/* =========================================================
   Z TESTS
   ========================================================= */

function testZ(
    name,
    sampleA,
    sampleB
) {

    const expected =
        referenceCurrentZ(
            sampleA,
            sampleB
        );


    let actual;


    try {

        const U =
            calculateMannWhitneyU(
                sampleA,
                sampleB
            );


        const nA =
            sampleA.length;

        const nB =
            sampleB.length;


        const variance =
            nA *
            nB *
            (
                nA +
                nB +
                1
            ) /
            12;


        const sigma =
            Math.sqrt(
                variance
            );


        actual =
            (
                U -
                nA * nB / 2
            ) /
            sigma;

    } catch (error) {

        actual =
            NaN;

    }


    addTest(
        name,
        "Current z",
        actual,
        expected
    );

}


/* =========================================================
   P TESTS
   ========================================================= */

function testP(
    name,
    sampleA,
    sampleB
) {

    const z =
        referenceCurrentZ(
            sampleA,
            sampleB
        );


    const expected =
        referenceCurrentP(
            z
        );


    let actual;


    try {

        actual =
            calculateMannWhitneyPValue(
                z
            );

    } catch (error) {

        actual =
            NaN;

    }


    addTest(
        name,
        "Current p-value",
        actual,
        expected
    );

}


/* =========================================================
   BASIC DATASETS
   ========================================================= */

const datasets = [

    {

        name:
            "n=3 vs n=3, complete separation",

        A:
            [1, 2, 3],

        B:
            [4, 5, 6]

    },

    {

        name:
            "n=5 vs n=5, complete separation",

        A:
            [1, 2, 3, 4, 5],

        B:
            [6, 7, 8, 9, 10]

    },

    {

        name:
            "n=3 vs n=30, complete separation",

        A:
            [1, 2, 3],

        B:
            Array.from(

                (_, i) => i + 4
            )

    },

    {

        name:
            "n=5 vs n=5, identical distributions",

        A:
            [1, 2, 3, 4, 5],

        B:
            [1, 2, 3, 4, 5]

    },

    {

        name:
            "overlapping samples",

        A:
            [1, 4, 5, 8, 10],

        B:
            [2, 3, 6, 7, 9]

    },

    {

        name:
            "reverse separation",

        A:
            [10, 11, 12, 13, 14],

        B:
            [1, 2, 3, 4, 5]

    },

    {

        name:
            "single observation per group",

        A:
            [1],

        B:
            [2]

    },

    {

        name:
            "n=2 vs n=2",

        A:
            [1, 2],

        B:
            [3, 4]

    },

    {

        name:
            "n=10 vs n=10",

/* =========================================================
   RUN BASIC TESTS
   ========================================================= */

for (
    const dataset of datasets

    testU(
        dataset.name,
        dataset.A,
        dataset.B
    );

    testZ(
        dataset.name,
        dataset.A,
        dataset.B
    );

    testP(
        dataset.name,
        dataset.A,
        dataset.B
    );

}


/* =========================================================
   TIE DATASETS
   ========================================================= */

const tieDatasets = [

    {

        name:
            "ties: one shared value",

        A:
            [1, 2, 3],

        B:
            [3, 4, 5]

    },

    {

        name:
            "ties: multiple shared values",

        A:
            [1, 2, 3, 4, 5],

        B:
            [3, 4, 5, 6, 7]

    },

            "ties: large tie block",

        A:

        B:
            [2, 2, 2, 4, 5]

    },

    {

        name:
            "ties: all observations identical",

        A:
            [1, 1, 1, 1],

        B:
            [1, 1, 1, 1]

    }

];


for (
    const dataset of tieDatasets
) {

    testU(
        dataset.name,
        dataset.A,
        dataset.B
    );

    testZ(
        dataset.name,
        dataset.A,
        dataset.B
    );

    testP(
        dataset.name,
        dataset.A,
        dataset.B
    );

}


/* =========================================================
   RANKING-SPECIFIC TESTS
   ========================================================= */

const rankingCases = [

    {

        name:
            "mid-rank: A/B split",

        A:
            [1, 2],

        B:
            [2, 3],

        expectedU:
            0.5

    },

    {

        name:
            "mid-rank: complete tie",

        A:
            [1, 1],

        B:
            [1, 1],

        expectedU:
            2

    },

    {

        name:
            "mid-rank: asymmetric tie",

        A:
            [1, 2, 2],

            1

];


for (
    const testCase of rankingCases
) {

    testU(
        testCase.name,
        testCase.A,
        testCase.B
    );

}


/* =========================================================
   INVARIANCE TESTS
   ========================================================= */

function runInvarianceTest(
    name,
    sampleA,
    sampleB,
    transformedA,
    transformedB
) {

    const originalU =
        referenceMannWhitneyU(
            sampleA,
            sampleB
        ).U;


    const transformedU =
        referenceMannWhitneyU(
            transformedA,
            transformedB
        ).U;


    let actualOriginal;

    let actualTransformed;


    try {

        actualOriginal =
            calculateMannWhitneyU(
                sampleA,
                sampleB
            );

        actualTransformed =
            calculateMannWhitneyU(
                transformedA,
                transformedB
            );

    } catch (error) {

        actualOriginal =
            NaN;

        actualTransformed =
            NaN;

    }


    const pass =
        nearlyEqual(
            actualOriginal,
            originalU
        ) &&
        nearlyEqual(
            actualTransformed,
            transformedU
        ) &&
        nearlyEqual(
            actualOriginal,
            actualTransformed
        );


    tests.push({

        name,

        category:
            "Invariance",

        actual:
            actualTransformed,

        expected:
            originalU,

        status:
            pass
                ? "PASS"
                : "FAIL"

    });

}


runInvarianceTest(

    "translation +1000",

    [1, 2, 3, 4],

    [5, 6, 7, 8],

    [1001, 1002, 1003, 1004],

    [1005, 1006, 1007, 1008]

);


runInvarianceTest(

    "positive scaling ×1000",

    [1, 2, 3, 4],

    [5, 6, 7, 8],

    [1000, 2000, 3000, 4000],

    [5000, 6000, 7000, 8000]

);


/* =========================================================
   EXTREME SCALE TESTS
   ========================================================= */

runInvarianceTest(

    "very small scale",

    [1, 2, 3],

    [4, 5, 6],

    [1e-15, 2e-15, 3e-15],

    [4e-15, 5e-15, 6e-15]

);


runInvarianceTest(

    "very large scale",

    [1, 2, 3],

    [4, 5, 6],

    [1e15, 2e15, 3e15],

    [4e15, 5e15, 6e15]

);


/* =========================================================
   INVALID / DEGENERATE TESTS
   ========================================================= */

function testDegenerate(
    name,
    sampleA,
    sampleB
) {

    let actual;


    try {

        actual =
            calculateMannWhitneyU(
                sampleA,
                sampleB
            );

    } catch (error) {

        actual =
            NaN;

    }


    const valid =
        Number.isFinite(actual);


    tests.push({

        name,

        category:
            "Degenerate",

        actual,

        expected:
            "implementation-defined",

        status:
            valid
                ? "WARN"
                : "PASS"

    });

}


testDegenerate(
    "empty A",
    [],
    [1, 2, 3]
);


testDegenerate(
    "empty B",
    [1, 2, 3],
    []
);


testDegenerate(
    "both empty",
    [],
    []
);


/* =========================================================
   DISPLAY
   ========================================================= */

function formatValue(
    value
) {

    if (
        typeof value !== "number"
    ) {

        return String(value);

    }


    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        !Number.isFinite(value)
    ) {

        return String(value);

    }


    return value.toPrecision(10);

}


function renderResults() {

    const results =
        document.getElementById(
            "results"
        );


    const total =
        tests.length;


    const failures =
        tests.filter(
            test =>
                test.status ===
                "FAIL"
        ).length;


    const warnings =
        tests.filter(
            test =>
                test.status ===
                "WARN"
        ).length;


    const valid =
        total -
        failures -
        warnings;


    document.getElementById(
        "totalTests"
    ).textContent =
        total;


    document.getElementById(
        "validTests"
    ).textContent =
        valid;


    document.getElementById(
        "warningTests"
    ).textContent =
        warnings;


    document.getElementById(
        "failureTests"
    ).textContent =
        failures;


    let html = "";


    html += `

        <h2>
            Test Results
        </h2>

        <table>

            <thead>

                <tr>

                    <th>Test</th>

                    <th>Category</th>

                    <th>Labistry</th>

                    <th>Reference</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

    `;


    for (
        const test of tests
    ) {

        html += `

            <tr>

                <td>
                    ${test.name}
                </td>

                <td>
                    ${test.category}
                </td>

                <td>
                    <code>
                        ${formatValue(test.actual)}
                    </code>
                </td>

                <td>
                    <code>
                        ${formatValue(test.expected)}
                    </code>
                </td>

                <td
                    class="${test.status}"
                >
                    ${test.status}
                </td>

            </tr>

        `;

    }


    html += `

            </tbody>

        </table>

        <div class="note">

            <strong>
                Interpretation:
            </strong>

            PASS means that Labistry agrees with the
            explicitly defined reference algorithm.

            WARN means that the behaviour is not considered
            an automatic failure and requires methodological
            review.

            FAIL means that the implementation does not
            reproduce the reference calculation.

        </div>

    `;


    results.innerHTML =
        html;

}


renderResults();

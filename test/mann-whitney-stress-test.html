<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const ABS_TOL =
    1e-10;

const REL_TOL =
    1e-8;


/* =========================================================
   NUMERICAL COMPARISON
   ========================================================= */

function nearlyEqual(
    actual,
    expected
) {

    if (
        Number.isNaN(actual) &&
        Number.isNaN(expected)
    ) {

        return true;

    }


    if (
        !Number.isFinite(actual) ||
        !Number.isFinite(expected)
    ) {

        return actual === expected;

    }


    const difference =
        Math.abs(
            actual -
            expected
        );


    const scale =
        Math.max(
            1,
            Math.abs(expected)
        );


    return (

        difference <=
            ABS_TOL

        ||

        difference <=
            REL_TOL *
            scale

    );

}


/* =========================================================
   REFERENCE RANKING
   ========================================================= */

/* ===================================
   REFERENCE MANN–WHITNEY U
   TIE CORRECTION + CONTINUITY CORRECTION
   =================================== */

function referenceMannWhitney(
    groupA,
    groupB
) {

    if (
        !Array.isArray(groupA) ||
        !Array.isArray(groupB) ||
        groupA.length === 0 ||
        groupB.length === 0
    ) {

        return {

            U1: NaN,
            U2: NaN,
            U: NaN,
            z: NaN,
            pValue: NaN

        };

    }


    const combined = [];


    groupA.forEach(
        value => {

            combined.push({
                value,
                group: "A"
            });

        }
    );


    groupB.forEach(
        value => {

            combined.push({
                value,
                group: "B"
            });

        }
    );


    combined.sort(
        (a, b) =>
            a.value - b.value
    );


    const nA =
        groupA.length;

    const nB =
        groupB.length;

    const n =
        nA + nB;


    let rank = 1;

    let rankSumA = 0;

    let i = 0;

    const tieGroupSizes = [];


    /* =================================
       RANKING
       ================================= */

    while (
        i < n
    ) {

        let j =
            i + 1;


        while (
            j < n &&
            combined[j].value ===
            combined[i].value
        ) {

            j++;

        }


        const tieSize =
            j - i;


        tieGroupSizes.push(
            tieSize
        );


        const averageRank =
            (
                rank +
                rank + tieSize - 1
            ) / 2;


        for (
            let k = i;
            k < j;
            k++
        ) {

            if (
                combined[k].group ===
                "A"
            ) {

                rankSumA +=
                    averageRank;

            }

        }


        rank +=
            tieSize;


        i =
            j;

    }


    /* =================================
       U
       ================================= */

    const U1 =
        rankSumA -
        nA * (nA + 1) / 2;


    const U2 =
        nA * nB -
        U1;


    const U =
        Math.min(
            U1,
            U2
        );


    /* =================================
       MEAN
       ================================= */

    const meanU =
        nA * nB / 2;


    /* =================================
       TIE CORRECTION
       ================================= */

    let tieCorrectionTerm = 0;


    tieGroupSizes.forEach(
        t => {

            if (
                t > 1
            ) {

                tieCorrectionTerm +=
                    t * t * t - t;

            }

        }
    );


    let varianceU;


    if (
        n > 1
    ) {

        varianceU =
            (
                nA * nB
            ) / 12 *
            (
                n + 1 -
                tieCorrectionTerm /
                (
                    n * (n - 1)
                )
            );

    }
    else {

        varianceU =
            NaN;

    }


    const sdU =
        Math.sqrt(
            varianceU
        );


    /* =================================
       Z + CONTINUITY CORRECTION
       ================================= */

    let z =
        NaN;


    if (
        sdU > 0
    ) {

        let correction = 0;


        if (
            U < meanU
        ) {

            correction =
                0.5;

        }
        else if (
            U > meanU
        ) {

            correction =
                -0.5;

        }


        z =
            (
                U -
                meanU +
                correction
            ) /
            sdU;

    }


    /* =================================
       TWO-TAILED P
       ================================= */

    let pValue =
        NaN;


    if (
        Number.isFinite(z)
    ) {

        const probability =
            normalCDF(
                Math.abs(z)
            );


        pValue =
            2 *
            (
                1 -
                probability
            );

    }


    return {

        U1,
        U2,
        U,
        z,
        pValue

    };

}

/* =========================================================
   COMPARE MANN–WHITNEY RESULTS
   ========================================================= */

function compareMannWhitneyResult(
    labistry,
    reference
) {

    const fields = [
        "U1",
        "U2",
        "U",
        "z",
        "pValue"
    ];


    for (
        const field of fields
    ) {

        const actual =
            labistry[field];

        const expected =
            reference[field];


        if (
            Number.isNaN(actual) &&
            Number.isNaN(expected)
        ) {

            continue;

        }


        if (
            Number.isNaN(actual) !==
            Number.isNaN(expected)
        ) {

            return {

                pass: false,
                field,
                actual,
                expected

            };

        }


        if (
            !nearlyEqual(
                actual,
                expected
            )
        ) {

            return {

                pass: false,
                field,
                actual,
                expected

            };

        }

    }


    return {

        pass: true

    };

}

   FULL LABISTRY TEST
   ========================================================= */

            U2: NaN,
            U: NaN,
            z: NaN,
            pValue: NaN

        };

    }


    const expected =
        referenceMannWhitney(
            groupA,
            groupB
        );


    addTest(
        name,
        "U1",
        actual.U1,
        expected.U1
    );


    addTest(
        name,
        "U2",
        actual.U2,
        expected.U2
    );


    addTest(
        name,
        "U",
        actual.U,
        expected.U
    );


    addTest(
        name,
        "z",
        actual.z,
        expected.z
    );


    addTest(
        name,
        "p-value",
        actual.pValue,
        expected.pValue
    );

}

/* =========================================================
   INVARIANCE TEST
   ========================================================= */

function testInvariance(
    name,
    originalA,
    originalB,
    transformedA,
    transformedB
) {

    let original;
    let transformed;


    try {

        original =
            calculateMannWhitneyU(
                originalA,
                originalB
            );


        transformed =
            calculateMannWhitneyU(
                transformedA,
                transformedB
            );

    } catch (error) {

        original = null;
        transformed = null;

    }


    const pass =

        original &&
        transformed &&

        nearlyEqual(
            original.U,
            transformed.U
        ) &&

        nearlyEqual(
            original.z,
            transformed.z
        ) &&

        nearlyEqual(
            original.pValue,
            transformed.pValue
        );


    tests.push({

        name,

        category:
            "invariance",

        actual:
            transformed
                ? transformed.U
                : NaN,

        expected:
            original
                ? original.U
                : NaN,

        status:
            pass
                ? "PASS"
                : "FAIL"

    });

}

}

/* =========================================================
   TIE-CORRECTED COMPARISON
   ========================================================= */

function getTieGroups(
    groupA,
    groupB
) {

    const values = [

        ...groupA,
        ...groupB

    ].sort(
        (a, b) =>
            a - b
    );


    const groups = [];


    let i = 0;


    while (
        i < values.length
    ) {

        let j =
            i + 1;


        while (

            j < values.length &&

            values[j] ===
                values[i]

        ) {

            j++;

        }


        const size =
            j - i;


        if (
            size > 1
        ) {

            groups.push(
                size
            );

        }


        i =
            j;

    }


    return groups;

}


function tieCorrectedZ(
    groupA,
    groupB
) {

    const result =
        referenceMannWhitney(
            groupA,
            groupB
        );


    if (
        !Number.isFinite(
            result.U
        )
    ) {

        return NaN;

    }


    const nA =
        groupA.length;

    const nB =
        groupB.length;

    const n =
        nA +
        nB;


    const ties =
        getTieGroups(
            groupA,
            groupB
        );


    let tieSum =
        0;


    for (
        const t of ties
    ) {

        tieSum +=
            t * t * t -
            t;

    }


    const variance =
        (
            nA *
            nB
        ) /
        12 *
        (
            n +
            1 -
            tieSum /
            (
                n *
                (n - 1)
            )
        );


    if (
        variance <= 0
    ) {

        return NaN;

    }


    return (

        result.U -
        nA * nB / 2

    ) /
    Math.sqrt(
        variance
    );

}

/* =========================================================

function formatValue(
    value
) {

    if (
        typeof value !==
        "number"
    ) {

        return String(value);

    }


    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        !Number.isFinite(value)
    ) {

        return String(value);

    }


    return value.toPrecision(
        10
    );

}

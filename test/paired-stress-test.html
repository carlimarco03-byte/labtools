<!-- =========================================================
     LABISTRY
     ========================================================= -->

<script src="../js/calculators/statistics/math.js"></script>

<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */


const ABS_TOL =
    1e-10;


const REL_TOL =
    1e-8;


/*
 * p-value tolerance is deliberately
 * slightly stricter than the generic
 * comparison.
 */

const P_ABS_TOL =
    1e-12;


const P_REL_TOL =
    1e-8;


/* =========================================================
   COUNTERS
   ========================================================= */


let totalTests =
    0;


let passTests =
    0;


let failTests =
    0;


let degenerateTests =
    0;


let executionErrors =
    0;


let warnings =
    0;


/* =========================================================
   NUMBER COMPARISON
   ========================================================= */


function nearlyEqual(
    a,
    b,
    absTolerance = ABS_TOL,
    relTolerance = REL_TOL
) {

    /*
     * NaN == NaN
     */

    if (
        Number.isNaN(a) &&
        Number.isNaN(b)
    ) {

        return true;

    }


    /*
     * Infinity
     */

    if (
        a === Infinity &&
        b === Infinity
    ) {

        return true;

    }


    if (
        a === -Infinity &&
        b === -Infinity
    ) {

        return true;

    }


    /*
     * Any remaining non-finite
     * mismatch is a failure.
     */

    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return false;

    }


    const difference =
        Math.abs(
            a - b
        );


    const scale =
        Math.max(
            Math.abs(a),
            Math.abs(b)
        );


    return (
        difference <=
        Math.max(
            absTolerance,
            relTolerance * scale
        )
    );

}


/* =========================================================
   FORMAT
   ========================================================= */


function formatValue(
    value
) {

    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        value === Infinity
    ) {

        return "+Infinity";

    }


    if (
        value === -Infinity
    ) {

        return "-Infinity";

    }


    if (
        !Number.isFinite(value)
    ) {

        return String(value);

    }


    return value.toPrecision(
        12
    );

}


/* =========================================================
   DIFFERENCE
   ========================================================= */


function getDifference(
    a,
    b
) {

    if (
        Number.isNaN(a) &&
        Number.isNaN(b)
    ) {

        return 0;

    }


    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return NaN;

    }


    return Math.abs(
        a - b
    );

}


/* =========================================================
   STATUS
   ========================================================= */


function addResult(
    testName,
    metric,
    labistry,
    scipy,
    status,
    difference = null
) {

    totalTests++;


    switch (
        status
    ) {

        case "PASS":

            passTests++;

            break;


        case "FAIL":

            failTests++;

            break;


        case "DEGENERATE":

            degenerateTests++;

            break;


        case "EXECUTION ERROR":

            executionErrors++;

            break;


        case "WARNING":

            warnings++;

            break;

    }


    const row =
        document.createElement(
            "tr"
        );


    let statusClass =
        "";


    switch (
        status
    ) {

        case "PASS":

            statusClass =
                "pass";

            break;


        case "FAIL":

            statusClass =
                "fail";

            break;


        case "DEGENERATE":

            statusClass =
                "degenerate";

            break;


        case "EXECUTION ERROR":

            statusClass =
                "execution";

            break;


        case "WARNING":

            statusClass =
                "warning";

            break;

    }


    row.innerHTML = `

        <td>
            ${testName}
        </td>

        <td>
            ${metric}
        </td>

        <td>
            ${formatValue(labistry)}
        </td>

        <td>
            ${formatValue(scipy)}
        </td>

        <td>
            ${
                difference === null
                    ? "—"
                    : formatValue(difference)
            }
        </td>

        <td class="${statusClass}">
            ${status}
        </td>

    `;


    document
        .getElementById(
            "results"
        )
        .appendChild(row);


    updateSummary();

}


/* =========================================================
   SUMMARY
   ========================================================= */


function updateSummary() {

    document.getElementById(
        "tests"
    ).textContent =
        totalTests;


    document.getElementById(
        "pass"
    ).textContent =
        passTests;


    document.getElementById(
        "fail"
    ).textContent =
        failTests;


    document.getElementById(
        "degenerate"
    ).textContent =
        degenerateTests;


    document.getElementById(
        "execution"
    ).textContent =
        executionErrors;


    document.getElementById(
        "warnings"
    ).textContent =
        warnings;

}


/* =========================================================
   VALIDATE ONE METRIC
   ========================================================= */


function validateMetric(
    testName,
    metric,
    labistry,
    scipy,
    isPValue = false
) {

    const pass =
        nearlyEqual(
            labistry,
            scipy,
            isPValue
                ? P_ABS_TOL
                : ABS_TOL,
            isPValue
                ? P_REL_TOL
                : REL_TOL
        );


    addResult(
        testName,
        metric,
        labistry,
        scipy,
        pass
            ? "PASS"
            : "FAIL",
        getDifference(
            labistry,
            scipy
        )
    );


    return pass;

}


/* =========================================================
   PAIRED TEST
   ========================================================= */


function runSciPyTest(
    testName,
    groupA,
    groupB,
    reference
) {

    let result;


    try {

        result =
            calculatePairedTTest(
                groupA,
                groupB
            );

    }
    catch (
        error
    ) {

        console.error(
            testName,
            error
        );


        addResult(
            testName,
            "execution",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );


        return;

    }


    if (
        !result ||
        typeof result !==
        "object"
    ) {

        addResult(
            testName,
            "execution",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );


        return;

    }


    /*
     * Special handling for
     * mathematically degenerate
     * datasets.
     */

    const isDegenerate =
        reference.degenerate === true;


    if (
        isDegenerate
    ) {

        let correct =
            true;


        correct =
            validateMetric(
                testName,
                "t statistic",
                result.tStatistic,
                reference.t
            ) &&
            correct;


        correct =
            validateMetric(
                testName,
                "degrees of freedom",
                result.degreesOfFreedom,
                reference.df
            ) &&
            correct;


        correct =
            validateMetric(
                testName,
                "p-value",
                result.pValue,
                reference.p,
                true
            ) &&
            correct;


        /*
         * Convert the three PASS
         * rows into the conceptual
         * DEGENERATE category.
         *
         * The numerical comparison
         * itself is still performed.
         */

        if (
            correct
        ) {

            /*
             * Informative console message.
             */

            console.info(
                "DEGENERATE:",
                testName
            );

        }


        return;

    }


    validateMetric(
        testName,
        "t statistic",
        result.tStatistic,
        reference.t
    );


    validateMetric(
        testName,
        "degrees of freedom",
        result.degreesOfFreedom,
        reference.df
    );


    validateMetric(
        testName,
        "p-value",
        result.pValue,
        reference.p,
        true
    );

}

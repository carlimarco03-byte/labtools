<body>


<h1>

</h1>


<div class="info">

        Direct numerical comparison of

        <code>

        </code>

        against independently generated

        SciPy

        <code>

        </code>

    </p>

        <code>

        </code>

        ,

        <code>
            REL_TOL = 1e-8
        </code>

    </p>

<!-- =====================================

     ===================================== -->

<script src="../js/calculators/statistics/math.js"></script>

<script src="../js/calculators/statistics/descriptive.js"></script>

<script src="../js/calculators/statistics/two-groups.js"></script>

<script src="../js/calculators/statistics/paired.js"></script>

/* =====================================

/* =====================================

    },


    {

        b:

        reference:
        {
            t:
                1.6666666666666667,

                0.17047066135682063,

        }
    },


    {
        name:
            "Mostly negative",

        a:
            [9, 19, 29, 41, 49],

        reference:

        }
    },


    {

            "Alternating",

    /* =================================

       ================================= */


    {

];


/* =====================================
   NUMERICAL COMPARISON
   ===================================== */

function nearlyEqual(
    labistry,
    reference
) {

    if (
        Number.isNaN(labistry) &&
        Number.isNaN(reference)
    ) {

        return true;

    }


    if (
        labistry === reference
    ) {

        return true;

    }


    if (
        !Number.isFinite(labistry) ||
        !Number.isFinite(reference)
    ) {

        return false;

    }


    const absoluteDifference =
        Math.abs(
            labistry -
            reference
        );


    const scale =
        Math.max(
            Math.abs(labistry),
            Math.abs(reference),
            1
        );


    return (
        absoluteDifference <=
        Math.max(
            ABS_TOL,
            REL_TOL * scale
        )
    );

}


/* =====================================
   FORMAT VALUE
   ===================================== */

function formatValue(
    value
) {

    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        value === Infinity
    ) {

        return "Infinity";

    }


    if (
        value === -Infinity
    ) {

        return "-Infinity";

    }


    if (
        value === null ||
        value === undefined
    ) {

        return "—";

    }


    return value.toPrecision(12);

}


/* =====================================
   RUN SINGLE TEST
   ===================================== */

function runSingleTest(
    test
) {

    try {

        if (
            typeof calculatePairedTTest !==
            "function"
        ) {

            throw new Error(
                "calculatePairedTTest() is not available."
            );

        }


        const result =
            calculatePairedTTest(
                test.a,
                test.b
            );


        if (!result) {

            throw new Error(
                "calculatePairedTTest() returned null."
            );

        }


        const tPass =
            nearlyEqual(
                result.tStatistic,
                test.reference.t
            );


        const pPass =
            nearlyEqual(
                result.pValue,
                test.reference.p
            );


        const dfPass =
            nearlyEqual(
                result.degreesOfFreedom,
                test.reference.df
            );


        let status;


        if (
            test.degenerate
        ) {

            status =
                "DEGENERATE";

        } else if (
            tPass &&
            pPass &&
            dfPass
        ) {

            status =
                "PASS";

        } else {

            status =
                "FAIL";

        }


        return {

            name:
                test.name,

            status:
                status,

            labT:
                result.tStatistic,

            scipyT:
                test.reference.t,

            labP:
                result.pValue,

            scipyP:
                test.reference.p,

            labDf:
                result.degreesOfFreedom,

            scipyDf:
                test.reference.df,

            meanDifference:
                result.meanDifference,

            sd:
                result.standardDeviation,

            sem:
                result.sem

        };

    } catch (error) {

        return {

            name:
                test.name,

            status:
                "EXECUTION ERROR",

            error:
                error.message

        };

    }

}


/* =====================================
   RUN ALL TESTS
   ===================================== */

function runStressTest() {

    const results =
        testCases.map(
            runSingleTest
        );


    renderSummary(
        results
    );


    renderResults(
        results
    );


    console.log(
        "LABISTRY PAIRED T-TEST RESULTS",
        results
    );

}


/* =====================================
   SUMMARY
   ===================================== */

function renderSummary(
    results
) {

    const tests =
        results.length;


    const pass =
        results.filter(
            result =>
                result.status === "PASS"
        ).length;


    const fail =
        results.filter(
            result =>
                result.status === "FAIL"
        ).length;


    const degenerate =
        results.filter(
            result =>
                result.status === "DEGENERATE"
        ).length;


    const executionErrors =
        results.filter(
            result =>
                result.status ===
                "EXECUTION ERROR"
        ).length;


    document.getElementById(
        "summary"
    ).innerHTML = `

        <div class="card">

            Tests

            <strong>
                ${tests}
            </strong>

        </div>


        <div class="card">

            PASS

            <strong>
                ${pass}
            </strong>

        </div>


        <div class="card">

            FAIL

            <strong>
                ${fail}
            </strong>

        </div>


        <div class="card">

            Degenerate

            <strong>
                ${degenerate}
            </strong>

        </div>


        <div class="card">

            Execution errors

            <strong>
                ${executionErrors}
            </strong>

        </div>

    `;


    const problematic =
        results.filter(
            result =>
                result.status === "FAIL" ||
                result.status === "EXECUTION ERROR"
        );


    if (
        problematic.length === 0
    ) {

        document.getElementById(
            "message"
        ).innerHTML = `

            <div class="info">

                <strong>
                    ALL NON-DEGENERATE TESTS PASSED
                </strong>

                <p>

                    Degenerate constant-difference
                    cases are reported separately.

                </p>

            </div>

        `;

    } else {

        document.getElementById(
            "message"
        ).innerHTML = `

            <div class="error-box">

                <strong>
                    FAILURES DETECTED
                </strong>

                <br><br>

                ${problematic
                    .map(
                        result =>
                            `${result.name}: ${
                                result.error ||
                                result.status
                            }`
                    )
                    .join("<br>")}

            </div>

        `;

    }

}


/* =====================================
   RESULTS TABLE
   ===================================== */

function renderResults(
    results
) {

    let html = `

        <table>

            <thead>

                    <th>
                        Case

                    </th>

                    <th>
                        Labistry df

                    <th>
                        SciPy df
                    </th>

                    <th>
                        Mean Δ
                    </th>

                    <th>
                        SD Δ
                    </th>

                    <th>
                        SEM Δ
                    </th>

                </tr>

            <tbody>
    `;


    results.forEach(

                    </td>

                    <td>
                        ${result.status}
                    </td>

                        ${formatValue(

                    </td>

                    <td>
                        ${formatValue(
                            result.scipyT
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.labP
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.scipyP
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.labDf
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.scipyDf
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.meanDifference
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.sd
                        )}
                    </td>

                    <td>
                        ${formatValue(
                            result.sem
                        )}
                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    document.getElementById(
        "results"
    ).innerHTML =
        html;

}


/* =====================================
   EVENT
   ===================================== */

document.getElementById(

</script>

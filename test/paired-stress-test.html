<!-- ===================================
     LABISTRY DEPENDENCIES
     =================================== -->

<script src="../js/calculators/statistics/utils.js"></script>

<script src="../js/calculators/statistics/math.js"></script>

<script src="../js/calculators/statistics/descriptive.js"></script>

<script>

/* ===================================
   TEST CONFIGURATION
   =================================== */

const ABS_TOL =
    1e-10;


const REL_TOL =
    1e-8;


/* ===================================
   REFERENCE LOG GAMMA
   =================================== */

function referenceLogGamma(z) {

    const coefficients = [

        676.5203681218851,

        -1259.1392167224028,

        771.32342877765313,

        -176.61502916214059,

        12.507343278686905,

        -0.13857109526572012,

        9.9843695780195716e-6,

        1.5056327351493116e-7

    ];


    if (z < 0.5) {

        return Math.log(Math.PI) -
            Math.log(Math.sin(Math.PI * z)) -
            referenceLogGamma(1 - z);

    }


    let x =
        0.99999999999980993;


    const shifted =
        z - 1;


    for (
        let i = 0;
        i < coefficients.length;
        i++
    ) {

        x +=
            coefficients[i] /
            (shifted + i + 1);

    }


    const t =
        shifted +
        coefficients.length -
        0.5;


    return (
        0.5 * Math.log(2 * Math.PI) +
        (shifted + 0.5) * Math.log(t) -
        t +
        Math.log(x)
    );

}


/* ===================================
   REFERENCE LOG BETA
   =================================== */

function referenceLogBeta(
    a,
    b
) {

    return (
        referenceLogGamma(a) +
        referenceLogGamma(b) -
        referenceLogGamma(a + b)
    );

}


/* ===================================
   REFERENCE BETA FRACTION
   =================================== */

function referenceBetaFraction(
    x,
    a,
    b
) {

    const MAX_ITER =
        200;


    const EPS =
        3e-14;


    const FPMIN =
        1e-300;


    let qab =
        a + b;


    let qap =
        a + 1;


    let qam =
        a - 1;


    let c =
        1;


    let d =
        1 -
        qab * x /
        qap;


    if (
        Math.abs(d) <
        FPMIN
    ) {

        d =
            FPMIN;

    }


    d =
        1 / d;


    let h =
        d;


    for (
        let m = 1;
        m <= MAX_ITER;
        m++
    ) {

        const m2 =
            2 * m;


        let aa =
            m *
            (b - m) *
            x /
            (
                (qam + m2) *
                (a + m2)
            );


        d =
            1 +
            aa * d;


        if (
            Math.abs(d) <
            FPMIN
        ) {

            d =
                FPMIN;

        }


        c =
            1 +
            aa / c;


        if (
            Math.abs(c) <
            FPMIN
        ) {

            c =
                FPMIN;

        }


        d =
            1 / d;


        h *=
            d * c;


        aa =
            -(
                (a + m) *
                (qab + m) *
                x
            ) /
            (
                (a + m2) *
                (qap + m2)
            );


        d =
            1 +
            aa * d;


        if (
            Math.abs(d) <
            FPMIN
        ) {

            d =
                FPMIN;

        }


        c =
            1 +
            aa / c;


        if (
            Math.abs(c) <
            FPMIN
        ) {

            c =
                FPMIN;

        }


        d =
            1 / d;


        const delta =
            d * c;


        h *=
            delta;


        if (
            Math.abs(delta - 1) <
            EPS
        ) {

            break;

        }

    }


    return h;

}


/* ===================================
   REFERENCE REGULARIZED BETA
   =================================== */

function referenceRegularizedBeta(
    x,
    a,
    b
) {

    if (x <= 0) {

        return 0;

    }


    if (x >= 1) {

        return 1;

    }


    const logFront =
        a * Math.log(x) +
        b * Math.log(1 - x) -
        referenceLogBeta(a, b);


    const front =
        Math.exp(logFront);


    if (
        x <
        (a + 1) /
        (a + b + 2)
    ) {

        return (
            front *
            referenceBetaFraction(
                x,
                a,
                b
            ) /
            a
        );

    }


    return (
        1 -
        front *
        referenceBetaFraction(
            1 - x,
            b,
            a
        ) /
        b
    );

}


/* ===================================
   REFERENCE STUDENT T CDF
   =================================== */

function referenceStudentTCDF(
    t,
    df
) {

    if (
        !Number.isFinite(t) ||
        !Number.isFinite(df) ||
        df <= 0
    ) {

        return NaN;

    }


    if (t === 0) {

        return 0.5;

    }


    const x =
        df /
        (df + t * t);


    const ib =
        referenceRegularizedBeta(
            x,
            df / 2,
            0.5
        );


    if (t > 0) {

        return 1 -
            0.5 * ib;

    }


    return 0.5 * ib;

}


/* ===================================
   REFERENCE TWO-TAILED P VALUE
   =================================== */

function referenceTwoTailedP(
    t,
    df
) {

    if (Number.isNaN(t)) {

        return NaN;

    }


    if (
        t === Infinity ||
        t === -Infinity
    ) {

        return 0;

    }


    const cdf =
        referenceStudentTCDF(
            Math.abs(t),
            df
        );


    return 2 * (1 - cdf);

}


/* ===================================
   REFERENCE MEAN
   =================================== */

function referenceMean(data) {

    return (
        data.reduce(
            (sum, value) =>
                sum + value,
            0
        ) /
        data.length
    );

}


/* ===================================
   REFERENCE SAMPLE SD
   =================================== */

function referenceSampleSD(data) {

    const mean =
        referenceMean(data);


    const sum =
        data.reduce(
            (total, value) =>
                total +
                Math.pow(
                    value - mean,
                    2
                ),
            0
        );


    return Math.sqrt(
        sum /
        (data.length - 1)
    );

}


/* ===================================
   REFERENCE PAIRED T-TEST
   =================================== */

function referencePairedTTest(
    groupA,
    groupB
) {

    if (
        !Array.isArray(groupA) ||
        !Array.isArray(groupB)
    ) {

        return null;

    }


    if (
        groupA.length < 2 ||
        groupB.length < 2
    ) {

        return null;

    }


    if (
        groupA.length !==
        groupB.length
    ) {

        return null;

    }


    if (
        !groupA.every(
            value =>
                Number.isFinite(value)
        ) ||
        !groupB.every(
            value =>
                Number.isFinite(value)
        )
    ) {

        return null;

    }


    const n =
        groupA.length;


    const differences =
        groupA.map(
            (value, index) =>
                value -
                groupB[index]
        );


    const meanDifference =
        referenceMean(
            differences
        );


    const standardDeviation =
        referenceSampleSD(
            differences
        );


    const sem =
        standardDeviation /
        Math.sqrt(n);


    const degreesOfFreedom =
        n - 1;


    let tStatistic;


    if (sem === 0) {

        if (meanDifference === 0) {

            tStatistic =
                NaN;

        } else {

            tStatistic =
                meanDifference > 0
                    ? Infinity
                    : -Infinity;

        }

    } else {

        tStatistic =
            meanDifference /
            sem;

    }


    const pValue =
        referenceTwoTailedP(
            tStatistic,
            degreesOfFreedom
        );


    return {

        n,

        differences,

        meanDifference,

        standardDeviation,

        sem,

        tStatistic,

        degreesOfFreedom,

        pValue

    };

}


/* ===================================
   COMPARISON
   =================================== */

function nearlyEqual(
    actual,
    expected
) {

    if (
        Number.isNaN(actual) &&
        Number.isNaN(expected)
    ) {

        return true;

    }


    if (
        actual === expected
    ) {

        return true;

    }


    if (
        !Number.isFinite(actual) ||
        !Number.isFinite(expected)
    ) {

        return false;

    }


    const difference =
        Math.abs(
            actual -
            expected
        );


    const scale =
        Math.max(
            Math.abs(actual),
            Math.abs(expected),
            1
        );


    return (
        difference <=
        Math.max(
            ABS_TOL,
            REL_TOL * scale
        )
    );

}


/* ===================================
   FORMAT VALUE
   =================================== */

function formatValue(value) {

    if (Number.isNaN(value)) {

        return "NaN";

    }


    if (value === Infinity) {

        return "+Infinity";

    }


    if (value === -Infinity) {

        return "-Infinity";

    }


    if (!Number.isFinite(value)) {

        return String(value);

    }


    return value.toPrecision(12);

}


/* ===================================
   TEST CASES
   =================================== */

const tests = [

    {
        name:
            "Normal n=5",

        A:
            [10, 12, 11, 13, 12],

        B:
            [9, 13, 10, 12, 11]

    },


    {
        name:
            "Positive differences",

        A:
            [10, 20, 30, 40, 50],

        B:
            [8, 18, 27, 35, 45]

    },


    {
        name:
            "Negative differences",

        A:
            [8, 18, 27, 35, 45],

        B:
            [10, 20, 30, 40, 50]

    },


    {
        name:
            "Mixed-sign differences",

        A:
            [10, 20, 30, 40, 50],

        B:
            [12, 18, 32, 37, 55]

    },


    {
        name:
            "Negative values",

        A:
            [-10, -8, -6, -4, -2],

        B:
            [-12, -7, -8, -3, -5]

    },


    {
        name:
            "Negative and positive values",

        A:
            [-5, 0, 5, 10, 15],

        B:
            [5, -2, 7, 4, 20]

    },


    {
        name:
            "Decimal values",

        A:
            [1.25, 2.75, 3.10, 4.85, 5.40],

        B:
            [1.10, 2.40, 3.25, 4.20, 5.75]

    },


    {
        name:
            "Normal n=3",

        A:
            [5, 8, 11],

        B:
            [4, 6, 10]

    },


    {
        name:
            "Normal n=10",

        A:
            [10, 12, 9, 15, 14, 11, 13, 16, 8, 17],

        B:
            [9, 11, 10, 13, 12, 10, 15, 14, 7, 15]

    },


    {
        name:
            "Zero mean difference",

        A:
            [1, 4, 7, 10, 13],

        B:
            [2, 3, 8, 9, 13]

    },


    {
        name:
            "Small scale 1e-6",

        A:
            [1e-6, 2e-6, 3e-6, 4e-6, 5e-6],

        B:
            [0.8e-6, 1.7e-6, 3.2e-6, 3.5e-6, 4.8e-6]

    },


    {
        name:
            "Small scale 1e-12",

        A:
            [1e-12, 2e-12, 3e-12, 4e-12, 5e-12],

        B:
            [0.8e-12, 1.7e-12, 3.2e-12, 3.5e-12, 4.8e-12]

    },


    {
        name:
            "Large scale 1e6",

        A:
            [1e6, 2e6, 3e6, 4e6, 5e6],

        B:
            [0.8e6, 1.7e6, 3.2e6, 3.5e6, 4.8e6]

    },


    {
        name:
            "Large scale 1e12",

        A:
            [1e12, 2e12, 3e12, 4e12, 5e12],

        B:
            [0.8e12, 1.7e12, 3.2e12, 3.5e12, 4.8e12]

    },


    {
        name:
            "Constant positive difference",

        A:
            [2, 4, 6, 8, 10],

        B:
            [1, 3, 5, 7, 9]

    },


    {
        name:
            "Constant negative difference",

        A:
            [1, 3, 5, 7, 9],

        B:
            [2, 4, 6, 8, 10]

    },


    {
        name:
            "All differences zero",

        A:
            [1, 2, 3, 4, 5],

        B:
            [1, 2, 3, 4, 5]

    },


    {
        name:
            "Very small differences",

        A:
            [1, 2, 3, 4, 5],

        B:
            [
                0.999999,
                1.999998,
                3.000001,
                3.999997,
                5.000002
            ]

    },


    {
        name:
            "Unequal lengths",

        A:
            [1, 2, 3, 4, 5],

        B:
            [1, 2, 3, 4]

    },


    {
        name:
            "n=1",

        A:
            [5],

        B:
            [4]

    },


    {
        name:
            "Invalid value",

        A:
            [1, 2, NaN, 4, 5],

        B:
            [1, 2, 3, 4, 5]

    }

];


/* ===================================
   METRICS
   =================================== */

const metrics = [

    "n",

    "meanDifference",

    "standardDeviation",

    "sem",

    "tStatistic",

    "degreesOfFreedom",

    "pValue"

];


/* ===================================
   RUN TESTS
   =================================== */

let totalTests = 0;

let validTests = 0;

let failures = 0;

let warnings = 0;


const resultsBody =
    document.getElementById(
        "resultsBody"
    );


tests.forEach(
    test => {

        let labistry;

        let reference;


        try {

            labistry =
                calculatePairedTTest(
                    test.A,
                    test.B
                );

        } catch (error) {

            labistry =
                null;

            console.error(
                "Labistry error:",
                test.name,
                error
            );

        }


        try {

            reference =
                referencePairedTTest(
                    test.A,
                    test.B
                );

        } catch (error) {

            reference =
                null;

            console.error(
                "Reference error:",
                test.name,
                error
            );

        }


        metrics.forEach(
            metric => {

                totalTests++;


                const actual =
                    labistry
                        ? labistry[metric]
                        : null;


                const expected =
                    reference
                        ? reference[metric]
                        : null;


                let pass;


                if (
                    actual === null &&
                    expected === null
                ) {

                    pass = true;

                } else {

                    pass =
                        nearlyEqual(
                            actual,
                            expected
                        );

                }


                if (pass) {

                    validTests++;

                } else {

                    failures++;

                }


                const difference =
                    (
                        Number.isFinite(actual) &&
                        Number.isFinite(expected)
                    )
                        ? Math.abs(
                            actual -
                            expected
                        )
                        : "—";


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${test.name}
                    </td>

                    <td>
                        ${metric}
                    </td>

                    <td>
                        ${formatValue(actual)}
                    </td>

                    <td>
                        ${formatValue(expected)}
                    </td>

                    <td>
                        ${
                            typeof difference ===
                            "number"
                                ? difference.toExponential(6)
                                : difference
                        }
                    </td>

                    <td class="${
                        pass
                            ? "pass"
                            : "fail"
                    }">

                        ${
                            pass
                                ? "PASS"
                                : "FAIL"
                        }

                    </td>

                `;


                resultsBody.appendChild(
                    row
                );

            }
        );

    }
);


/* ===================================
   SUMMARY
   =================================== */

const summary =
    document.getElementById(
        "summary"
    );


const statusClass =
    failures === 0
        ? "pass"
        : "fail";


summary.innerHTML = `

    <strong>
        Tests:
    </strong>
    ${totalTests}

    &nbsp;&nbsp;

    <strong>
        Valid:
    </strong>
    ${validTests}

    &nbsp;&nbsp;

    <strong>
        Failures:
    </strong>
    ${failures}

    &nbsp;&nbsp;

    <strong>
        Warnings:
    </strong>
    ${warnings}

    <br><br>

    <span class="${statusClass}">

        ${
            failures === 0
                ? "ALL TESTS PASSED"
                : "FAILURES DETECTED"
        }

    </span>

`;

</script>

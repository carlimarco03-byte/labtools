/* =========================================================
   CONFIGURATION
   ========================================================= */


const ABS_TOL =
    1e-10;


const REL_TOL =
    1e-8;


/*
 * SciPy reference:
 *
 * scipy.stats.ttest_rel(
 *     a,
 *     b
 * )
 *
 * SciPy version used to generate
 * the reference values:
 *
 * 1.17.0
 */


let totalTests =
    0;

let validTests =
    0;

let failures =
    0;

let degenerateTests =
    0;

let executionErrors =
    0;

let warnings =
    0;


/* =========================================================
   NUMERICAL COMPARISON
   ========================================================= */


function nearlyEqual(
    a,
    b
) {

    /*
     * NaN == NaN
     *
     * This is important for
     * the zero-difference
     * degenerate case.
     */

    if (
        Number.isNaN(a) &&
        Number.isNaN(b)
    ) {

        return true;

    }


    /*
     * Infinity must match
     * exactly.
     */

    if (
        a === Infinity &&
        b === Infinity
    ) {

        return true;

    }


    if (
        a === -Infinity &&
        b === -Infinity
    ) {

        return true;

    }


    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return false;

    }


    const difference =
        Math.abs(
            a - b
        );


    const scale =
        Math.max(
            Math.abs(a),
            Math.abs(b),
            1
        );


    return (
        difference <=
        Math.max(
            ABS_TOL,
            REL_TOL * scale
        )
    );

}


/* =========================================================
   FORMAT
   ========================================================= */


function formatValue(
    value
) {

    if (
        Number.isNaN(value)
    ) {

        return "NaN";

    }


    if (
        value === Infinity
    ) {

        return "+Infinity";

    }


    if (
        value === -Infinity
    ) {

        return "-Infinity";

    }


    if (
        !Number.isFinite(value)
    ) {

        return String(value);

    }


    return value.toPrecision(12);

}


/* =========================================================
   DIFFERENCE
   ========================================================= */


function numericalDifference(
    a,
    b
) {

    if (
        Number.isNaN(a) &&
        Number.isNaN(b)
    ) {

        return 0;

    }


    if (
        !Number.isFinite(a) ||
        !Number.isFinite(b)
    ) {

        return NaN;

    }


    return Math.abs(
        a - b
    );

}


/* =========================================================
   ADD RESULT
   ========================================================= */


function addResult(
    testName,
    metric,
    labistry,
    scipy,
    status,
    difference = null
) {

    totalTests++;


    if (
        status === "PASS"
    ) {

        validTests++;

    }
    else if (
        status === "FAIL"
    ) {

        failures++;

    }
    else if (
        status === "DEGENERATE"
    ) {

        degenerateTests++;

    }
    else if (
        status === "EXECUTION ERROR"
    ) {

        executionErrors++;

    }
    else if (
        status === "WARNING"
    ) {

        warnings++;

    }


    const row =
        document.createElement(
            "tr"
        );


    let statusClass =
        "";


    if (
        status === "PASS"
    ) {

        statusClass =
            "pass";

    }
    else if (
        status === "FAIL"
    ) {

        statusClass =
            "fail";

    }
    else if (
        status === "DEGENERATE"
    ) {

        statusClass =
            "degenerate";

    }
    else if (
        status === "EXECUTION ERROR"
    ) {

        statusClass =
            "execution";

    }


    row.innerHTML = `

        <td>
            ${testName}
        </td>

        <td>
            ${metric}
        </td>

        <td>
            ${formatValue(labistry)}
        </td>

        <td>
            ${formatValue(scipy)}
        </td>

        <td>
            ${
                difference === null

                    : formatValue(difference)
            }
        </td>

        <td class="${statusClass}">
            ${status}
        </td>

    `;


    document
        .getElementById(
            "results"
        )
        .appendChild(row);


    updateSummary();

}


/* =========================================================
   SUMMARY
   ========================================================= */


function updateSummary() {

/* =========================================================
   TEST CASE
   ========================================================= */


function runTest(
    testName,
    groupA,
    groupB,
    reference
) {

    let result;


    /*
     * Execution test
     */

    try {

        result =
            calculatePairedTTest(
                groupA,
                groupB
            );

    }
    catch (error) {

        addResult(
            testName,
            "execution",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );

        return;

    }


    if (
        !result
    ) {

        addResult(
            testName,
            "execution",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );

        return;

    }


    /*
     * Compare t statistic
     */

    const tPass =
        nearlyEqual(
            result.tStatistic,
            reference.t
        );


    addResult(
        testName,
        "t statistic",
        result.tStatistic,
        reference.t,
        tPass
            ? "PASS"
            : "FAIL",
        numericalDifference(
            result.tStatistic,
            reference.t
        )
    );


    /*
     * Compare degrees of freedom
     */

    const dfPass =
        nearlyEqual(
            result.degreesOfFreedom,
            reference.df
        );


    addResult(
        testName,
        "degrees of freedom",
        result.degreesOfFreedom,
        reference.df,
        dfPass
            ? "PASS"
            : "FAIL",
        numericalDifference(
            result.degreesOfFreedom,
            reference.df
        )
    );


    /*
     * Compare p-value
     */

    const pPass =
        nearlyEqual(
            result.pValue,
            reference.p
        );


    addResult(
        testName,
        "p-value",
        result.pValue,
        reference.p,
        pPass
            ? "PASS"
            : "FAIL",
        numericalDifference(
            result.pValue,
            reference.p
        )
    );

}

/* =========================================================
   RANDOM SEEDED DATA
   ========================================================= */


function seededRandom(
    seed
) {

    let value =
        seed >>> 0;


    return function () {

        value =
            (
                1664525 *
                value +
                1013904223
            ) >>> 0;


        return (
            value /
            4294967296
        );

    };

}


/*
 * Box-Muller normal generator.
 */

function normalRandomGenerator(
    seed
) {

    const random =
        seededRandom(seed);


    let spare =
        null;


    return function () {

        if (
            spare !== null
        ) {

            const value =
                spare;

            spare =
                null;

            return value;

        }


        let u;
        let v;


        do {

            u =
                random();

        }
        while (
            u === 0
        );


        v =
            random();


        const magnitude =
            Math.sqrt(
                -2 *
                Math.log(u)
            );


        const angle =
            2 *
            Math.PI *
            v;


        spare =
            magnitude *
            Math.sin(angle);


        return (
            magnitude *
            Math.cos(angle)
        );

    };

}

/* =========================================================
   INTERNAL STRUCTURE TESTS
   ========================================================= */


function runStructureTest(
    testName,
    groupA,
    groupB
) {

    let result;


    try {

        result =
            calculatePairedTTest(
                groupA,
                groupB
            );

    }
    catch (error) {

        addResult(
            testName,
            "structure",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );

        return;

    }


    if (
        !result
    ) {

        addResult(
            testName,
            "structure",
            NaN,
            NaN,
            "EXECUTION ERROR"
        );

        return;

    }


    const expectedN =
        groupA.length;


    const expectedDF =
        expectedN - 1;


    const differences =
        groupA.map(
            (
                value,
                index
            ) =>
                value -
                groupB[index]
        );


    const mean =
        differences.reduce(
            (
                sum,
                value
            ) =>
                sum + value,
            0
        ) /
        differences.length;


    const nPass =
        result.n ===
        expectedN;


    const dfPass =
        result.degreesOfFreedom ===
        expectedDF;


    const meanPass =
        nearlyEqual(
            result.meanDifference,
            mean
        );


    const allPass =
        nPass &&
        dfPass &&
        meanPass;


    addResult(
        testName,
        "internal structure",
        allPass ? 1 : 0,
        1,
        allPass
            ? "PASS"
            : "FAIL",
        allPass
            ? 0
            : 1
    );

}

        groupB.push(

        groupB

}

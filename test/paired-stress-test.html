function nearlyEqual(a,b){
    if (Number.isNaN(a) && Number.isNaN(b)) return true;
    if (!Number.isFinite(a) || !Number.isFinite(b)) return a === b;
    const d=Math.abs(a-b);
    return d <= ABS_TOL || d <= REL_TOL*Math.max(Math.abs(a),Math.abs(b));
}
function fmt(x){
    if (x === null) return 'NaN';
    if (x === Infinity) return 'Infinity';
    if (x === -Infinity) return '-Infinity';
    if (Number.isNaN(x)) return 'NaN';
    return Number(x).toExponential(12);
}
function extract(result){
    if (typeof result === 'number') return {t:result,p:NaN,df:NaN};
    if (!result || typeof result !== 'object') throw new Error('Invalid Labistry result');
    const t=result.tStatistic ?? result.t ?? result.statistic ?? result.tValue;
    const p=result.pValue ?? result.p ?? result.pvalue;
    const df=result.degreesOfFreedom ?? result.df ?? result.dof;
    return {t:Number(t),p:Number(p),df:Number(df)};
}
function compareMetric(name,metric,lab,ref){
    const ok=nearlyEqual(lab,ref);
    const d=(Number.isFinite(lab)&&Number.isFinite(ref)) ? Math.abs(lab-ref) : (lab===ref?0:NaN);
    return {name,metric,lab,ref,d,status:ok?'PASS':'FAIL'};
}
function run(){
    const body=document.getElementById('results'); body.innerHTML='';
    let total=0,pass=0,fail=0,warn=0;
    if(typeof LABISTRY_FUNCTION !== 'function'){
        document.getElementById('status').textContent='ERROR: calculatePairedTTest was not found.';
        return;
    }
    for(const c of CASES){
        let r;
        try{r=extract(LABISTRY_FUNCTION(c.a,c.b));}
        catch(e){
            fail++;
            body.insertAdjacentHTML('beforeend',`<tr><td>${c.name}</td><td>execution</td><td colspan="3">${String(e.message).replaceAll('<','&lt;')}</td><td class="fail">FAIL</td></tr>`);
            continue;
        }
        const ref={t:c.t,p:c.p,df:c.df};
        for(const metric of ['t','p','df']){
            const x=compareMetric(c.name,metric,r[metric],ref[metric]); total++; if(x.status==='PASS') pass++; else fail++;
            body.insertAdjacentHTML('beforeend',`<tr><td>${x.name}</td><td>${metric}</td><td>${fmt(x.lab)}</td><td>${fmt(x.ref)}</td><td>${fmt(x.d)}</td><td class="${x.status==='PASS'?'pass':'fail'}">${x.status}</td></tr>`);
        }
    }
    document.getElementById('summary').innerHTML=`<div class="card"><b>Tests</b><br>${total}</div><div class="card"><b>Valid</b><br>${pass}</div><div class="card"><b>Failures</b><br>${fail}</div><div class="card"><b>Warnings</b><br>${warn}</div>`;
    document.getElementById('status').textContent=fail===0?'ALL TESTS PASSED':'TESTS COMPLETED — FAILURES DETECTED';
}
document.getElementById('run').addEventListener('click',run);

<h1>Labistry One-Sample t-Test — μ₀ Stress Test</h1>

<p>
This harness tests the One-Sample t-test with hypothesized means
different from zero, including negative values and extreme numerical scales.
</p>

<button onclick="runTests()">Run stress tests</button>

<button onclick="location.reload()">Reset</button>

<div id="summary" class="summary">
Tests not run.
</div>

<table>

<thead>
<tr>
    <th>Test</th>

    <th>Status</th>
</tr>

<script>

/* ===================================
   TOLERANCE
   =================================== */

const ABS_TOL = 1e-10;
const REL_TOL = 1e-8;


/* ===================================
   HELPERS
   =================================== */

function nearlyEqual(a, b) {

    if (Number.isNaN(a) && Number.isNaN(b)) {
        return true;
    }

    if (!Number.isFinite(a) || !Number.isFinite(b)) {
        return a === b;
    }

    const difference =
        Math.abs(a - b);

    const scale =
        Math.max(
            Math.abs(a),
            Math.abs(b),
            1
        );

    return (
        difference <= ABS_TOL ||
        difference / scale <= REL_TOL
    );
}


function formatNumber(value) {

    if (Number.isNaN(value)) {
        return "NaN";
    }

    if (!Number.isFinite(value)) {
        return String(value);
    }

    return value.toExponential(12);
}


/* ===================================
   REFERENCE MATH
   =================================== */

/*
 * Reference implementation using the
 * same mathematical definition as SciPy:
 *
 * t = (mean - μ0) / (s / sqrt(n))
 *
 * p = 2 * survival_probability(|t|)
 *
 * The regularized incomplete beta function
 * is implemented below to avoid dependencies.
 */


/* ---------- logGamma ---------- */

function logGamma(z) {

    const coefficients = [
        676.5203681218851,
        -1259.1392167224028,
        771.32342877765313,
        -176.61502916214059,
        12.507343278686905,
        -0.13857109526572012,
        9.9843695780195716e-6,
        1.5056327351493116e-7
    ];

    if (z < 0.5) {

        return Math.log(Math.PI) -
            Math.log(Math.sin(Math.PI * z)) -
            logGamma(1 - z);

    }

    z -= 1;

    let x = 0.99999999999980993;

    for (
        let i = 0;
        i < coefficients.length;
        i++
    ) {

        x +=
            coefficients[i] /
            (z + i + 1);

    }

    const t =
        z +
        coefficients.length -
        0.5;

    return (
        0.5 * Math.log(2 * Math.PI) +
        (z + 0.5) * Math.log(t) -
        t +
        Math.log(x)
    );
}


/* ---------- beta continued fraction ---------- */

function betaContinuedFraction(
    a,
    b,
    x
) {

    const MAX_ITER = 200;
    const EPS = 3e-14;
    const FPMIN = 1e-300;

    let qab = a + b;
    let qap = a + 1;
    let qam = a - 1;

    let c = 1;
    let d =
        1 -
        qab * x /
        qap;

    if (Math.abs(d) < FPMIN) {
        d = FPMIN;
    }

    d = 1 / d;

    let h = d;

    for (
        let m = 1;
        m <= MAX_ITER;
        m++
    ) {

        let m2 = 2 * m;

        let aa =
            m *
            (b - m) *
            x /
            (
                (qam + m2) *
                (a + m2)
            );

        d =
            1 +
            aa * d;

        if (Math.abs(d) < FPMIN) {
            d = FPMIN;
        }

        c =
            1 +
            aa / c;

        if (Math.abs(c) < FPMIN) {
            c = FPMIN;
        }

        d = 1 / d;

        h *= d * c;

        aa =
            -(
                a + m
            ) *
            (
                qab + m
            ) *
            x /
            (
                (a + m2) *
                (qap + m2)
            );

        d =
            1 +
            aa * d;

        if (Math.abs(d) < FPMIN) {
            d = FPMIN;
        }

        c =
            1 +
            aa / c;

        if (Math.abs(c) < FPMIN) {
            c = FPMIN;
        }

        d = 1 / d;

        const delta =
            d * c;

        h *= delta;

        if (
            Math.abs(delta - 1) <
            EPS
        ) {
            break;
        }
    }

    return h;
}


/* ---------- regularized incomplete beta ---------- */

function regularizedIncompleteBeta(
    x,
    a,
    b
) {

    if (x <= 0) {
        return 0;
    }

    if (x >= 1) {
        return 1;
    }

    const logBeta =
        logGamma(a) +
        logGamma(b) -
        logGamma(a + b);

    const front =
        Math.exp(
            a * Math.log(x) +
            b * Math.log1p(-x) -
            logBeta
        );

    if (
        x <
        (a + 1) /
        (a + b + 2)
    ) {

        return (
            front *
            betaContinuedFraction(
                a,
                b,
                x
            ) /
            a
        );

    }

    return (
        1 -
        front *
        betaContinuedFraction(
            b,
            a,
            1 - x
        ) /
        b
    );
}


/* ---------- Student-t CDF ---------- */

function studentTCDF(
    t,
    df
) {

    if (!Number.isFinite(t) || df <= 0) {
        return NaN;
    }

    if (t === 0) {
        return 0.5;
    }

    const x =
        df /
        (df + t * t);

    const ib =
        regularizedIncompleteBeta(
            x,
            df / 2,
            0.5
        );

    if (t > 0) {
        return 1 - 0.5 * ib;
    }

    return 0.5 * ib;
}


/* ===================================
   REFERENCE ONE-SAMPLE T-TEST
   =================================== */

function referenceOneSample(
    data,
    hypothesizedMean
) {

    const n = data.length;

    const mean =
        data.reduce(
            (sum, value) =>
                sum + value,
            0
        ) / n;

    let sumSquared =
        0;

    for (const value of data) {

        const d =
            value - mean;

        sumSquared +=
            d * d;

    }

    const variance =
        sumSquared /
        (n - 1);

    const sd =
        Math.sqrt(variance);

    const sem =
        sd /
        Math.sqrt(n);

    const t =
        (
            mean -
            hypothesizedMean
        ) /
        sem;

    const df =
        n - 1;

    const cdf =
        studentTCDF(
            Math.abs(t),
            df
        );

    const p =
        2 *
        (
            1 - cdf
        );

    return {
        t,
        df,
        p
    };
}


/* ===================================
   LABISTRY IMPLEMENTATION
   =================================== */

function labistryOneSample(
    data,
    hypothesizedMean
) {

    const n =
        data.length;

    const mean =
        calculateMean(data);

    const sd =
        calculateStandardDeviation(
            data,
            true
        );

    const sem =
        calculateSEM(data);

    const difference =
        mean -
        hypothesizedMean;

    const t =
        difference /
        sem;

    const df =
        n - 1;

    const pValue =
        calculateTTestPValue(
            Math.abs(t),
            df
        );

    return {
        t,
        df,
        p: pValue
    };
}


/* ===================================
   TEST DATA
   =================================== */

const tests = [

    {
        name: "Normal data, μ₀ = 0",
        data: [10, 11, 12, 13, 14],
        mu0: 0
    },

    {
        name: "Normal data, μ₀ = 10",
        data: [10, 11, 12, 13, 14],
        mu0: 10
    },

    {
        name: "Normal data, μ₀ = 12",
        data: [10, 11, 12, 13, 14],
        mu0: 12
    },

    {
        name: "Normal data, μ₀ = 14",
        data: [10, 11, 12, 13, 14],
        mu0: 14
    },

    {
        name: "Negative data, μ₀ = -8",
        data: [-10, -9, -8, -7, -6],
        mu0: -8
    },

    {
        name: "Negative data, μ₀ = -10",
        data: [-10, -9, -8, -7, -6],
        mu0: -10
    },

    {
        name: "Mixed data, μ₀ = -1",
        data: [-4, -2, 0, 2, 4],
        mu0: -1
    },

    {
        name: "Mixed data, μ₀ = 1",
        data: [-4, -2, 0, 2, 4],
        mu0: 1
    },

    {
        name: "Decimal data, μ₀ = 0.15",
        data: [0.10, 0.12, 0.15, 0.18, 0.20],
        mu0: 0.15
    },

    {
        name: "Decimal data, μ₀ = -0.15",
        data: [-0.10, -0.12, -0.15, -0.18, -0.20],
        mu0: -0.15
    },

    {
        name: "Small scale 1e-6",
        data: [1e-6, 2e-6, 3e-6, 4e-6, 5e-6],
        mu0: 2e-6
    },

    {
        name: "Small scale 1e-12",
        data: [1e-12, 2e-12, 3e-12, 4e-12, 5e-12],
        mu0: 2e-12
    },

    {
        name: "Large scale 1e6",
        data: [1e6, 2e6, 3e6, 4e6, 5e6],
        mu0: 2e6
    },

    {
        name: "Large scale 1e12",
        data: [1e12, 2e12, 3e12, 4e12, 5e12],
        mu0: 2e12
    },

    {
        name: "μ₀ far below mean",
        data: [10, 11, 12, 13, 14],
        mu0: -100
    },

    {
        name: "μ₀ far above mean",
        data: [10, 11, 12, 13, 14],
        mu0: 100
    },

    {
        name: "μ₀ equals sample mean",
        data: [3, 5, 7, 9, 11],
        mu0: 7
    },

    {
        name: "n = 3, negative μ₀",
        data: [-2, 0, 2],
        mu0: -1
    },

    {
        name: "n = 3, positive μ₀",
        data: [2, 4, 6],
        mu0: 3
    },

    {
        name: "n = 10, μ₀ = 5",
        data: [2, 4, 5, 6, 7, 8, 9, 4, 6, 7],
        mu0: 5
    }

];


/* ===================================
   RUN TESTS
   =================================== */

function runTests() {

    const results =
        document.getElementById(
            "results"
        );

    const summary =
        document.getElementById(
            "summary"
        );

    results.innerHTML = "";

    let total = 0;
    let valid = 0;
    let failures = 0;

    for (const test of tests) {

        const lab =
            labistryOneSample(
                test.data,
                test.mu0
            );

        const ref =
            referenceOneSample(
                test.data,
                test.mu0
            );

        const metrics = [
            ["t statistic", lab.t, ref.t],
            ["Degrees of freedom", lab.df, ref.df],
            ["p-value", lab.p, ref.p]
        ];

        for (const [
            metric,
            labValue,
            refValue
        ] of metrics) {

            total++;

            const difference =
                Math.abs(
                    labValue -
                    refValue
                );

            const pass =
                nearlyEqual(
                    labValue,
                    refValue
                );

            if (pass) {
                valid++;
            } else {
                failures++;
            }

            const row =
                document.createElement(
                    "tr"
                );

            row.innerHTML = `
                <td>${test.name}</td>
                <td>${metric}</td>
                <td>${formatNumber(labValue)}</td>
                <td>${formatNumber(refValue)}</td>
                <td>${formatNumber(difference)}</td>
                <td class="${pass ? "pass" : "fail"}">
                    ${pass ? "PASS" : "FAIL"}
                </td>
            `;

            results.appendChild(row);
        }
    }

    summary.innerHTML = `
        <strong>Tests:</strong> ${total}
        &nbsp;&nbsp;
        <strong>Valid:</strong> ${valid}
        &nbsp;&nbsp;
        <strong>Failures:</strong> ${failures}
    `;
}

</script>

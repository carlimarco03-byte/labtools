<!DOCTYPE html>
<html>

<head>

<title>Molarity Calculator | LabTools</title>


<style>

body {

font-family: Arial, sans-serif;
background:#f5f7fa;
margin:40px;

}


.container {

max-width:600px;
background:white;
padding:30px;
margin:auto;
border-radius:10px;

}


input {

width:100%;
padding:10px;
margin:10px 0 20px 0;

}


button {

background:#1e3a5f;
color:white;
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;

}


.result {

margin-top:20px;
padding:15px;
background:#eef5ff;

}


</style>


</head>



<body>


<div class="container">


<h1>
Molarity Calculator
</h1>


<p>
Calculate the mass of compound required to prepare a solution with a specific molarity.
</p>


<h3>
Formula:
</h3>


<p>
mass (g) = molarity × molecular weight × volume (L)
</p>



<label>
Molecular weight (g/mol)
</label>

<input 
id="mw"
type="number"
placeholder="Example: 58.44">



<label>
Desired concentration (mol/L)
</label>

<input
id="molarity"
type="number"
placeholder="Example: 0.5">



<label>
Final volume (mL)
</label>

<input
id="volume"
type="number"
placeholder="Example: 100">



<button onclick="calculate()">
Calculate
</button>



<div class="result" id="result">

Result will appear here

</div>



</div>



<script>


function calculate(){


let mw =
Number(document.getElementById("mw").value);


let molarity =
Number(document.getElementById("molarity").value);


let volume =
Number(document.getElementById("volume").value);



if(mw<=0 || molarity<=0 || volume<=0){


document.getElementById("result").innerHTML =
"Please enter valid values.";


return;

}



let volumeLiters = volume / 1000;


let mass =
molarity * mw * volumeLiters;



document.getElementById("result").innerHTML =

"<b>Required mass:</b> "
+
mass.toFixed(3)
+
" g";


}



</script>



</body>

</html>

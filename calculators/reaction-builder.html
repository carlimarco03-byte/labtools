<section>

<div class="container">

<div class="calculator-box">

<h1>Reaction Mix Builder</h1>

<p>

Design fully customized PCR, qPCR and molecular biology reaction mixes with automatic volume calculation and master mix preparation.

</p>

 <div class="builder-settings">

    <div class="form-group">

        <label>Template</label>

        <select id="template">

            <option>PCR</option>
            <option>qPCR (SYBR)</option>
            <option>qPCR (Probe)</option>
            <option>RT-PCR</option>
            <option>Blank Mix</option>

        </select>

    </div>

</div>

  <div class="reaction-settings">

<h2>
Reaction Setup
</h2>

    <div 
id="reactionWarning"
class="reaction-warning">
</div>

<div class="settings-grid">


<div class="form-group">

<label>
Final reaction volume
</label>

<div>

<input 
id="reactionVolume"
type="number"
value="25"
min="0">

<span>µL</span>

</div>

</div>



<div class="form-group">

<label>
Number of reactions
</label>

<input 
id="reactionNumber"
type="number"
value="1"
min="1">

</div>



<div class="form-group">

<label>
Extra reactions
</label>

<input 
id="extraReactions"
type="number"
value="0"
min="0">

</div>



<div class="form-group">

<label>
Overage
</label>

<div>

<input 
id="overage"
type="number"
value="5"
min="0">

<span>%</span>

</div>

</div>


</div>

</div>
  
<div id="calculatorArea"></div>


<div class="table-actions">

    <button id="addComponentButton" class="btn-add-component">
        + Add component
    </button>

</div>

<!-- Calculator fields -->

</div>

<div class="calculator-actions">

    <button id="resetButton" class="btn-reset">
        Reset
    </button>

</div>


</div>

  <div 
id="componentMenu"
class="component-menu">



<button data-action="duplicate">
Duplicate
</button>

<button data-action="delete">
Delete
</button>

</div>

</div>

</section>

<div class="container">

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCR Master Mix Calculator | Labistry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="site-header">

<div class="container header-content">

<a href="../index.html" class="logo">
Labistry
</a>

<nav>

<a href="../calculators.html">Calculators</a>

<a href="#">Resources</a>

<a href="#">About</a>

</nav>

</div>

</header>

<section>

<div class="container">

<div class="calculator-box">

<h1>PCR Master Mix Calculator</h1>

<p>

Calculate PCR master mixes for any number of reactions.

</p>

<div class="form-group">

<label>Reaction volume (µL)</label>

<input
type="number"
id="reactionVolume"
placeholder="Example: 25">

</div>

<div class="form-group">

<label>Number of reactions</label>

<input
type="number"
id="reactions"
placeholder="Example: 12">

</div>

<div class="form-group">

<label>Extra volume (%)</label>

<select id="extra">

<option value="0">0%</option>
<option value="5">5%</option>
<option value="10" selected>10%</option>
<option value="15">15%</option>

</select>

</div>

<div class="button-group">

<button class="btn" onclick="calculatePCR()">

Calculate

</button>

<button class="btn btn-secondary" onclick="resetPCR()">

Reset

</button>

</div>

<div class="result-box" id="result">

Result will appear here

</div>

</div>

</div>

</section>

<footer class="footer">

<div class="container">

<p>

© 2026 Labistry — Free scientific calculators.

</p>

</div>

</footer>

<script>

function calculatePCR(){

document.getElementById("result").innerHTML =
"PCR calculation coming in the next step.";

}

function resetPCR(){

document.getElementById("reactionVolume").value = "";

document.getElementById("reactions").value = "";

document.getElementById("extra").value = "10";

document.getElementById("result").innerHTML =
"Result will appear here";

}

</script>

</body>

</html>
